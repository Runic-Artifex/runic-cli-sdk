name: CI

# Pull request branches run through `pull_request` only. The macOS and the Windows jobs run in nightly and manual runs
# and for a version or release commit on main (eng/ci/full-run-paths.txt); on a pull request or another push to main,
# each platform's jobs run only when it changes a path that can behave differently there (eng/ci/macos-paths.txt,
# eng/ci/windows-paths.txt). A run that runs both runs every job and uploads the ci-full-run artifact; Publish preview
# and the runic-sdk train take a commit's packages only from such a full green run on main (CONTRIBUTING.md, "CI
# triggers and platform jobs").
on:
  push:
    branches: [main]
  pull_request:
  # Nightly, every job on every platform.
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its running CI. Every other run has its own group, so no main push run is
# cancelled or replaced while it waits.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the macOS and the Windows jobs run (eng/ci/platform-changes.sh): for a pull request, each when its test
  # merge commit changes a path in that platform's list against the base branch (the merge commit's first parent); for
  # a push to main, the same against the previous main commit, and both for a version or release commit
  # (eng/ci/full-run-paths.txt); both in nightly and manual runs. A run that runs both runs every job, and outside pull
  # requests it uploads the ci-full-run marker.
  changes:
    name: Platform paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.paths.outputs.macos }}
      windows: ${{ steps.paths.outputs.windows }}
      full: ${{ steps.paths.outputs.full }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Decide whether the macOS and Windows jobs run
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          event="$EVENT"
          # A push compares with the previous main commit. A push that moved main by more than one commit runs every job
          # rather than miss a path that an earlier commit of it changed.
          if [[ "$event" == push && "$BEFORE" != "$(git rev-parse HEAD^1)" ]]; then
            echo "This push moved main from ${BEFORE:-nothing}, not from the first parent of $GITHUB_SHA."
            event=push-range
          fi
          bash eng/ci/platform-changes.sh --event "$event" HEAD^1 HEAD
      # Publish preview and the runic-sdk train take a commit's packages only from a full green run on main and find it
      # by this artifact (CONTRIBUTING.md, "CI triggers and platform jobs").
      - name: Mark the full run
        if: steps.paths.outputs.full == 'true' && github.event_name != 'pull_request'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-full-run"
          jq -n --arg event "$EVENT" --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            '{schema: "runic.ci.full-run/1", event: $event, sha: $sha, run: $run}' > "$RUNNER_TEMP/ci-full-run/full-run.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.paths.outputs.full == 'true' && github.event_name != 'pull_request'
        with:
          name: ci-full-run
          path: ${{ runner.temp }}/ci-full-run
          if-no-files-found: error
          # As long as the package artifact it vouches for.
          retention-days: 30
          overwrite: true

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # The first parent, for the vendored conformance core's upstream comparison.
          fetch-depth: 2
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      # A first-party reusable workflow (the runic-sdk train gate) is pinned to a full commit SHA that may have no
      # tag; its comment names that commit instead of a version.
      - name: Require pinned remote actions
        run: |
          if grep -rnE '^\s*(- )?uses:\s*[^.][^@]*@' .github/workflows \
            | grep -vE '@[0-9a-f]{40} # v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -vE 'uses:\s*Runic-Artifex/[A-Za-z0-9._-]+/\.github/workflows/[A-Za-z0-9._-]+\.ya?ml@[0-9a-f]{40} # \S'; then
            echo "Pin every remote action to a full commit SHA followed by '# vX.Y.Z'."
            exit 1
          fi
      - name: Test release tooling
        run: python3 -m unittest discover -s eng/release -v
      - name: Test the platform path rule
        run: python3 -m unittest discover -s eng/ci -v
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # The vendored conformance driver core (eng/conformance/README.md). Offline, on every run: the copy matches its
      # stamp. The comparison with runic-sdk at the pinned commit needs the network, so it runs only when the copy or the
      # stamp changes, as the Cargo.lock checks run only on lock changes (runic-sdk R1 section 7).
      - name: Test the vendored conformance driver core
        run: bun test eng/conformance/vendor.test.mjs
      # The old-name guards (eng/rename/README.md): the generated guard files match their inputs. The managed suites run
      # them in MSBuild (OldNameGuardsTests).
      - name: Test the old-name guards' generated files
        run: bun test eng/rename/old-names.test.mjs
      - name: Compare the vendored conformance driver core with runic-sdk
        run: |
          if git diff --quiet HEAD^1 HEAD -- eng/conformance/core eng/conformance/core.vendor.json; then
            echo "The vendored core and its stamp are unchanged; the offline check covers them."
          else
            bun eng/conformance/vendor.mjs upstream
          fi
      # The conformance corpora's committed case lists are current, and their status files follow their rules and list
      # exactly the corpus's cases (eng/conformance/README.md). Offline; no adapter runs here.
      - name: Check the conformance case lists and status files
        run: |
          bun eng/conformance/cli.ts cases --check
          bun eng/conformance/cli.ts lint

  managed-and-pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Install completion shell prerequisites
        run: eng/ci/apt-install.sh fish zsh
      - run: ./eng/test.sh
      # TRX reports and Cobertura coverage of the TUnit suites, also when a case failed.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: command-line-test-results
          path: artifacts/test-results
          if-no-files-found: ignore
      # The Command Line corpus through the language-neutral driver and the .NET adapter, which eng/test.sh built with
      # the solution (eng/conformance/README.md, "Command Line"). A result that differs from its status file fails.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Run the Command Line corpus through the conformance driver
        env:
          CONFIGURATION: Release
        run: bun eng/conformance/cli.ts dotnet-commandline --no-build
      - run: ./eng/pack.sh "$(./eng/package-version.sh)" artifacts/packages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: command-line-packages
          path: artifacts/packages
          if-no-files-found: error
          # Publish preview reuses this artifact of a successful full run on main (the changes job's ci-full-run).
          retention-days: 30

  # The managed suites on the other desktop platforms: console, terminal, signal and process
  # behaviour differs there. Linux runs them, the examples and the packing in managed-and-pack.
  managed-windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - run: ./eng/test.sh --managed-only
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: command-line-test-results-${{ runner.os }}
          path: artifacts/test-results
          if-no-files-found: ignore

  managed-macos:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - run: ./eng/test.sh --managed-only
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: command-line-test-results-${{ runner.os }}
          path: artifacts/test-results
          if-no-files-found: ignore

  # Source and candidate package NativeAOT checks on every supported RID, each compiled and run
  # on its own operating system and architecture. The musl legs run in Alpine: GitHub cannot run
  # JavaScript actions in an Alpine container on arm64 runners, so the runner checks out and
  # downloads the candidates, and eng/ci/native-musl.sh installs the toolchain in `docker run`. osx-arm64 runs in
  # native-aot-macos, win-x64 and win-arm64 in native-aot-windows.
  native-aot:
    needs: managed-and-pack
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: ubuntu-24.04
            rid: linux-musl-x64
            musl: true
          - os: ubuntu-24.04-arm
            rid: linux-musl-arm64
            musl: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Alpine 3.22, the oldest Alpine release that .NET 10 supports beyond November 2026.
      ALPINE_IMAGE: docker.io/library/alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        if: ${{ !matrix.musl }}
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: command-line-packages
          path: artifacts/packages
      - name: Install Linux NativeAOT prerequisites
        if: ${{ runner.os == 'Linux' && !matrix.musl }}
        run: eng/ci/apt-install.sh clang zlib1g-dev
      - name: Source and candidate package NativeAOT smoke
        if: ${{ !matrix.musl }}
        shell: pwsh
        run: ./eng/ci/native-aot.ps1 -RuntimeIdentifier '${{ matrix.rid }}'
      - name: Source and candidate package NativeAOT smoke in Alpine
        if: ${{ matrix.musl }}
        run: |
          docker run --rm --init -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            "$ALPINE_IMAGE" sh eng/ci/native-musl.sh "$RID"
        env:
          RID: ${{ matrix.rid }}

  # The Windows legs of the NativeAOT smoke, with MSVC's linker: only when a path in eng/ci/windows-paths.txt changed.
  native-aot-windows:
    needs: [changes, managed-and-pack]
    if: needs.changes.outputs.windows == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
            msvc: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          - os: windows-11-arm
            rid: win-arm64
            msvc: Microsoft.VisualStudio.Component.VC.Tools.ARM64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: command-line-packages
          path: artifacts/packages
      - name: Check Windows NativeAOT prerequisites
        shell: pwsh
        env:
          MSVC_COMPONENT: ${{ matrix.msvc }}
        run: |
          $installation = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires $env:MSVC_COMPONENT -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw "Visual C++ build tools ($env:MSVC_COMPONENT) are required." }
          Write-Host "Using Visual C++ build tools from $installation"
      - name: Source and candidate package NativeAOT smoke
        shell: pwsh
        run: ./eng/ci/native-aot.ps1 -RuntimeIdentifier '${{ matrix.rid }}'

  native-aot-macos:
    needs: [changes, managed-and-pack]
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: command-line-packages
          path: artifacts/packages
      - name: Check macOS NativeAOT prerequisites
        run: xcrun --find clang
      - name: Source and candidate package NativeAOT smoke
        shell: pwsh
        run: ./eng/ci/native-aot.ps1 -RuntimeIdentifier osx-arm64

  wpf-example:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Build the WPF example and its console companion
        run: |
          dotnet build examples/command-line/wpf/ReportApp.Wpf/ReportApp.Wpf.csproj -c Release -p:RunicCommandLineBuildMode=Verification
          dotnet build examples/command-line/wpf/ReportApp.Cli/ReportApp.Cli.csproj -c Release -p:RunicCommandLineBuildMode=Verification
      - name: Smoke the built executables
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'items.txt'
          & examples/command-line/wpf/ReportApp.Cli/bin/Release/net10.0/reportcli.exe items list > $out
          if ($LASTEXITCODE -ne 0) { throw "reportcli exited with $LASTEXITCODE" }
          if (-not (Select-String -Path $out -Pattern 'Rune stone: 3' -Quiet)) { throw 'reportcli output is missing the expected item.' }
          # The GUI executable must not start a window or block on a command launch.
          $gui = Start-Process -FilePath examples/command-line/wpf/ReportApp.Wpf/bin/Release/net10.0-windows/ReportApp.exe -ArgumentList 'items','list' -PassThru
          if (-not $gui.WaitForExit(30000)) { $gui.Kill(); throw 'ReportApp.exe blocked on a command launch.' }
          if ($gui.ExitCode -ne 64) { throw "ReportApp.exe exited with $($gui.ExitCode), expected 64." }
      - name: Run the example CLI tests on Windows
        run: dotnet run --project examples/command-line/wpf/Tests/ReportApp.Tests.csproj -c Release -p:RunicCommandLineBuildMode=Verification

  # The single required status check: it always reports, and fails unless every job passed. A macOS or Windows job may
  # be skipped only when the changes job decided so for a pull request or a push to main.
  verify:
    name: verify
    if: always()
    needs: [changes, workflows, managed-and-pack, managed-windows, managed-macos, native-aot, native-aot-windows, native-aot-macos, wpf-example]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
          MACOS: ${{ needs.changes.outputs.macos }}
          MACOS_JOBS: managed-macos native-aot-macos
          WINDOWS: ${{ needs.changes.outputs.windows }}
          WINDOWS_JOBS: managed-windows native-aot-windows
        run: |
          incomplete=false
          while IFS='=' read -r job result; do
            if [[ "$result" == success ]]; then continue; fi
            if [[ "$result" == skipped && "$MACOS" == false && " $MACOS_JOBS " == *" $job "* ]]; then
              echo "$job: skipped, no macOS path changed"
              continue
            fi
            if [[ "$result" == skipped && "$WINDOWS" == false && " $WINDOWS_JOBS " == *" $job "* ]]; then
              echo "$job: skipped, no Windows path changed"
              continue
            fi
            echo "$job: $result"
            incomplete=true
          done < <(jq -r 'to_entries[] | "\(.key)=\(.value.result)"' <<< "$NEEDS")
          if [[ "$incomplete" == true ]]; then
            echo "Verification is incomplete."
            exit 1
          fi
