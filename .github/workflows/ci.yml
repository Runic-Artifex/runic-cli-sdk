name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Require pinned remote actions
        run: |
          if grep -rnE '^\s*(- )?uses:\s*[^.][^@]*@' .github/workflows | grep -vE '@[0-9a-f]{40} # v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Pin every remote action to a full commit SHA followed by '# vX.Y.Z'."
            exit 1
          fi
      - name: Test release tooling
        run: python3 -m unittest discover -s eng/release -v

  managed-and-pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Install completion shell prerequisites
        run: eng/ci/apt-install.sh fish zsh
      - run: ./eng/test.sh
      # TRX reports and Cobertura coverage of the TUnit suites, also when a case failed.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: command-line-test-results
          path: artifacts/test-results
          if-no-files-found: ignore
      - run: ./eng/pack.sh "$(./eng/package-version.sh)" artifacts/packages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: command-line-packages
          path: artifacts/packages
          if-no-files-found: error
          # Publish preview reuses this artifact of the push run on main.
          retention-days: 30

  # The managed suites on the other desktop platforms: console, terminal, signal and process
  # behaviour differs there. Linux runs them, the examples and the packing in managed-and-pack.
  managed-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - run: ./eng/test.sh --managed-only
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: command-line-test-results-${{ runner.os }}
          path: artifacts/test-results
          if-no-files-found: ignore

  # Source and candidate package NativeAOT checks on every supported RID, each compiled and run
  # on its own operating system and architecture. The musl legs run in Alpine: GitHub cannot run
  # JavaScript actions in an Alpine container on arm64 runners, so the runner checks out and
  # downloads the candidates, and eng/ci/native-musl.sh installs the toolchain in `docker run`.
  native-aot:
    needs: managed-and-pack
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: ubuntu-24.04
            rid: linux-musl-x64
            musl: true
          - os: ubuntu-24.04-arm
            rid: linux-musl-arm64
            musl: true
          - os: windows-2025
            rid: win-x64
            msvc: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          - os: windows-11-arm
            rid: win-arm64
            msvc: Microsoft.VisualStudio.Component.VC.Tools.ARM64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Alpine 3.22, the oldest Alpine release that .NET 10 supports beyond November 2026.
      ALPINE_IMAGE: docker.io/library/alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        if: ${{ !matrix.musl }}
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: command-line-packages
          path: artifacts/packages
      - name: Install Linux NativeAOT prerequisites
        if: ${{ runner.os == 'Linux' && !matrix.musl }}
        run: eng/ci/apt-install.sh clang zlib1g-dev
      - name: Check macOS NativeAOT prerequisites
        if: runner.os == 'macOS'
        run: xcrun --find clang
      - name: Check Windows NativeAOT prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSVC_COMPONENT: ${{ matrix.msvc }}
        run: |
          $installation = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires $env:MSVC_COMPONENT -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw "Visual C++ build tools ($env:MSVC_COMPONENT) are required." }
          Write-Host "Using Visual C++ build tools from $installation"
      - name: Source and candidate package NativeAOT smoke
        if: ${{ !matrix.musl }}
        shell: pwsh
        run: ./eng/ci/native-aot.ps1 -RuntimeIdentifier '${{ matrix.rid }}'
      - name: Source and candidate package NativeAOT smoke in Alpine
        if: ${{ matrix.musl }}
        run: |
          docker run --rm --init -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            "$ALPINE_IMAGE" sh eng/ci/native-musl.sh "$RID"
        env:
          RID: ${{ matrix.rid }}

  wpf-example:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Build the WPF example and its console companion
        run: |
          dotnet build examples/command-line/wpf/ReportApp.Wpf/ReportApp.Wpf.csproj -c Release -p:RunicCommandLineBuildMode=Verification
          dotnet build examples/command-line/wpf/ReportApp.Cli/ReportApp.Cli.csproj -c Release -p:RunicCommandLineBuildMode=Verification
      - name: Smoke the built executables
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'items.txt'
          & examples/command-line/wpf/ReportApp.Cli/bin/Release/net10.0/reportcli.exe items list > $out
          if ($LASTEXITCODE -ne 0) { throw "reportcli exited with $LASTEXITCODE" }
          if (-not (Select-String -Path $out -Pattern 'Rune stone: 3' -Quiet)) { throw 'reportcli output is missing the expected item.' }
          # The GUI executable must not start a window or block on a command launch.
          $gui = Start-Process -FilePath examples/command-line/wpf/ReportApp.Wpf/bin/Release/net10.0-windows/ReportApp.exe -ArgumentList 'items','list' -PassThru
          if (-not $gui.WaitForExit(30000)) { $gui.Kill(); throw 'ReportApp.exe blocked on a command launch.' }
          if ($gui.ExitCode -ne 64) { throw "ReportApp.exe exited with $($gui.ExitCode), expected 64." }
      - name: Run the example CLI tests on Windows
        run: dotnet run --project examples/command-line/wpf/Tests/ReportApp.Tests.csproj -c Release -p:RunicCommandLineBuildMode=Verification

  # The single required status check: it always reports, and fails unless every job passed.
  verify:
    name: verify
    if: always()
    needs: [workflows, managed-and-pack, managed-platforms, native-aot, wpf-example]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          IFS=',' read -ra results <<< "$RESULTS"
          for result in "${results[@]}"; do
            if [[ "$result" != success ]]; then
              echo "Verification is incomplete: $RESULTS"
              exit 1
            fi
          done
