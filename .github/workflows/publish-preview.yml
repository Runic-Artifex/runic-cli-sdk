name: Publish preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact SemVer preview version
        required: true
        type: string
      dry-run:
        description: Check the CI artifact, NuGet and release without publishing
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-preview-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Read-only: finds the successful CI push run for this commit, verifies its
  # packages, writes their SBOM and checks NuGet, tag and release. A dry run ends
  # here; this job never holds OIDC, attestation or write permissions.
  candidate:
    if: github.repository == 'Runic-Artifex/runic-cli-sdk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      ci-run-id: ${{ steps.ci.outputs.run-id }}
      artifact-id: ${{ steps.ci.outputs.artifact-id }}
      # sha256sum lines of every candidate file; publish checks its download against them.
      release-sha256: ${{ steps.describe.outputs.sha256 }}
      sbom: ${{ steps.describe.outputs.sbom }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          version="$(./eng/package-version.sh "$VERSION")"
          expected_version="$(./eng/package-version.sh)"
          test "$version" = "$expected_version"
      - name: Find the successful CI run for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/release/release.py find-ci
      # By id, so a re-upload under the same name cannot change the downloaded bytes.
      # merge-multiple extracts the single artifact directly into path.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.ci.outputs.artifact-id }}
          merge-multiple: true
          path: artifacts/packages
          run-id: ${{ steps.ci.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Verify packages against the version and commit
        id: prepare
        env:
          CI_RUN_ID: ${{ steps.ci.outputs.run-id }}
        run: |
          mkdir -p artifacts/release
          python3 eng/release/release.py prepare artifacts/packages "$VERSION" "$CI_RUN_ID" artifacts/release/packages.json
      # Standard library only: the SBOM generator installs and executes nothing from the packages.
      - name: Describe the release (CycloneDX SBOM)
        id: describe
        run: |
          python3 eng/release/release.py describe artifacts/packages "$VERSION" artifacts/release
          {
            echo 'sha256<<SHA256'
            (cd artifacts/release && sha256sum -- *)
            echo SHA256
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ github.run_id }}
          path: artifacts/release
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Check NuGet without publishing
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: python3 eng/release/publish-nuget.py artifacts/packages https://api.nuget.org/v3/index.json --dry-run
      - name: Check tag and release without creating them
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/release/release.py release-check "$VERSION"

  publish:
    needs: candidate
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: preview
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id }}
          merge-multiple: true
          path: artifacts/packages
          run-id: ${{ needs.candidate.outputs.ci-run-id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate-${{ github.run_id }}
          path: artifacts/release
      - name: Check the candidate files against the candidate job
        working-directory: artifacts/release
        env:
          RELEASE_SHA256: ${{ needs.candidate.outputs.release-sha256 }}
        run: |
          test -n "$RELEASE_SHA256"
          printf '%s\n' "$RELEASE_SHA256" | sha256sum --check --strict
      - name: Verify packages against the candidate inventory
        env:
          CI_RUN_ID: ${{ needs.candidate.outputs.ci-run-id }}
        run: python3 eng/release/release.py verify artifacts/packages artifacts/release/packages.json "$VERSION" "$CI_RUN_ID"
      # Attest the verified bytes before anything is published: every package and release asset.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/packages/*.nupkg
            artifacts/release/${{ needs.candidate.outputs.sbom }}
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/packages/*.nupkg
          sbom-path: artifacts/release/${{ needs.candidate.outputs.sbom }}
      - id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: python3 eng/release/publish-nuget.py artifacts/packages https://api.nuget.org/v3/index.json "$NUGET_API_KEY"
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SBOM: ${{ needs.candidate.outputs.sbom }}
        run: python3 eng/release/release.py release "$VERSION" artifacts/packages "artifacts/release/$SBOM"
      - name: Note the documentation catalog step
        run: echo "Published $VERSION. Update the docs catalog in runic-site (see eng/release/README.md)." >> "$GITHUB_STEP_SUMMARY"
