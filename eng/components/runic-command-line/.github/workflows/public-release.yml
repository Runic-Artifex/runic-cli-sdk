name: Public release

on:
  pull_request:
    branches: [main]
    paths:
      - .github/actions/setup-dotnet/action.yml
      - .github/workflows/public-release.yml
      - Directory.Build.props
      - eng/download-github-packages.sh
      - eng/pack.sh
      - src/**/*.csproj
  workflow_dispatch:
    inputs:
      version:
        description: Exact SemVer package version
        required: true
        type: string
      publish_public:
        description: Publish the verified artifacts to nuget.org
        required: true
        default: false
        type: boolean
      confirmation:
        description: Type PUBLISH PUBLIC when publication is enabled
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: public-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  PACKAGE_VERSION: ${{ inputs.version || format('1.0.0-preview.{0}.{1}', github.run_number, github.run_attempt) }}

jobs:
  package:
    name: Verify public artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate request
        shell: bash
        env:
          PUBLISH_PUBLIC: ${{ inputs.publish_public }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be SemVer-compatible." >&2
            exit 1
          fi
          if [[ "$PUBLISH_PUBLIC" == "true" && "$CONFIRMATION" != "PUBLISH PUBLIC" ]]; then
            echo "Public publication requires the exact confirmation PUBLISH PUBLIC." >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-dotnet

      - name: Run verification pipeline
        run: ./eng/verify.sh

      - name: Ensure verification is reproducible
        run: git diff --exit-code

      - name: Create packages
        run: ./eng/pack.sh "$PACKAGE_VERSION" "$RUNNER_TEMP/packages"

      - name: Validate public package contract
        uses: Runic-Artifex/.github/.github/actions/validate-release-artifacts@main
        with:
          version: ${{ env.PACKAGE_VERSION }}
          artifact-directory: ${{ runner.temp }}/packages
          repository-url: https://github.com/Runic-Artifex/runic-command-line
          repository-commit: ${{ github.sha }}
          expected-nuget-count: "3"

      - name: Stage exact packages in GitHub Packages
        if: ${{ inputs.publish_public && inputs.confirmation == 'PUBLISH PUBLIC' && github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for package in "$RUNNER_TEMP"/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --source "https://nuget.pkg.github.com/Runic-Artifex/index.json" \
              --api-key "$GITHUB_TOKEN" \
              --skip-duplicate
          done

  publish:
    name: Publish to nuget.org
    if: ${{ inputs.publish_public && inputs.confirmation == 'PUBLISH PUBLIC' && github.ref == 'refs/heads/main' }}
    needs: package
    runs-on: ubuntu-24.04
    environment: public-release
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - name: Check out release plumbing
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-dotnet

      - name: Download exact staged packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./eng/download-github-packages.sh "$PACKAGE_VERSION" "$RUNNER_TEMP/packages"

      - name: Validate exact staged package contract
        uses: Runic-Artifex/.github/.github/actions/validate-release-artifacts@main
        with:
          version: ${{ env.PACKAGE_VERSION }}
          artifact-directory: ${{ runner.temp }}/packages
          repository-url: https://github.com/Runic-Artifex/runic-command-line
          repository-commit: ${{ github.sha }}
          expected-nuget-count: "3"

      - name: Refuse version reuse on a new dispatch
        shell: bash
        run: |
          set -euo pipefail
          for package in "$RUNNER_TEMP"/packages/*.nupkg; do
            filename="$(basename "$package")"
            package_id="${filename%."$PACKAGE_VERSION".nupkg}"
            if [[ "$package_id" == "$filename" ]]; then
              echo "Cannot derive a package ID from '$filename'." >&2
              exit 1
            fi
            package_id="${package_id,,}"
            url="https://api.nuget.org/v3-flatcontainer/$package_id/$PACKAGE_VERSION/$package_id.$PACKAGE_VERSION.nupkg"
            if curl --fail --silent --show-error --output /dev/null "$url"; then
              if [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]; then
                echo "$package_id $PACKAGE_VERSION already exists on nuget.org; choose a new version." >&2
                exit 1
              fi
              echo "$package_id $PACKAGE_VERSION already exists; retry will skip it."
            fi
          done

      - name: Sign in to nuget.org with trusted publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          for package in "$RUNNER_TEMP"/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done
