name: Prerelease packages

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/prerelease-packages.yml
      - Directory.Build.props
      - eng/pack.sh
      - src/**/*.csproj
  workflow_dispatch:
    inputs:
      version:
        description: Exact SemVer candidate version
        required: true
        type: string
      publish:
        description: Publish the verified packages to GitHub Packages
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: prerelease-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  PACKAGE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || format('0.1.0-preview.{0}.{1}', github.run_number, github.run_attempt) }}

jobs:
  package:
    name: Verify and package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run verification pipeline
        run: ./eng/verify.sh

      - name: Ensure verification is reproducible
        run: git diff --exit-code

      - name: Create prerelease packages
        run: ./eng/pack.sh "$PACKAGE_VERSION" "$RUNNER_TEMP/packages"

      - name: Record package digests
        working-directory: ${{ runner.temp }}/packages
        run: sha256sum ./*.nupkg > SHA256SUMS

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: runic-command-line-${{ env.PACKAGE_VERSION }}
          path: ${{ runner.temp }}/packages/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to GitHub Packages
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: runic-command-line-${{ env.PACKAGE_VERSION }}
          path: ${{ runner.temp }}/packages

      - name: Verify package digests
        working-directory: ${{ runner.temp }}/packages
        run: sha256sum --check SHA256SUMS

      - name: Publish packages
        run: |
          for package in "$RUNNER_TEMP"/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --source "https://nuget.pkg.github.com/Runic-Artifex/index.json" \
              --api-key "$GITHUB_TOKEN" \
              --skip-duplicate
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
